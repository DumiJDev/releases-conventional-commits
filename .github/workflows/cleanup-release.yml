name: Cleanup Releases

on:
  workflow_run:
    workflows:
      - Release
    types:
      - completed

permissions:
  packages: write

jobs:
  cleanup:
    name: Keep Latest 5 Versions
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest

    steps:
      - name: Cleanup GHCR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail

          OWNER="${REPOSITORY%%/*}"
          PACKAGE="${REPOSITORY#*/}"

          PACKAGE="$(echo "$PACKAGE" | tr '[:upper:]' '[:lower:]')"

          echo "Repository: $REPOSITORY"
          echo "Package: $PACKAGE"

          gh api \
            --paginate \
            "/users/${OWNER}/packages/container/${PACKAGE}/versions?per_page=100" \
            > versions.json

          mapfile -t VERSIONS < <(
            jq -r '
              .[]
              | .metadata.container.tags[]
              | select(test("^[0-9]+\\.[0-9]+\\.[0-9]+$"))
            ' versions.json |
            sort -Vu |
            tail -n +1 |
            tac
          )

          echo "Semantic versions:"
          printf '%s\n' "${VERSIONS[@]}"

          KEEP=5

          if [[ "${#VERSIONS[@]}" -le "$KEEP" ]]; then
            echo "Nothing to delete."
            exit 0
          fi

          for VERSION in "${VERSIONS[@]:$KEEP}"; do

            echo "Deleting version: $VERSION"

            VERSION_ID="$(
              jq -r \
                --arg version "$VERSION" '
                  .[]
                  | select(
                      .metadata.container.tags
                      | index($version)
                    )
                  | .id
                ' versions.json |
              head -n 1
            )"

            if [[ -z "$VERSION_ID" || "$VERSION_ID" == "null" ]]; then
              echo "Could not find package version ID for $VERSION"
              continue
            fi

            gh api \
              --method DELETE \
              "/users/${OWNER}/packages/container/${PACKAGE}/versions/${VERSION_ID}"

          done
