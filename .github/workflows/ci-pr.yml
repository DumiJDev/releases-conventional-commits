name: CI - PR

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify PR
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Java 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Enable Maven Wrapper
        run: chmod +x mvnw

      - name: Validate Maven Wrapper
        run: ./mvnw --version

      - name: Check Spotless
        run: |
          set +e

          ./mvnw -B spotless:check
          STATUS=$?

          if [[ "$STATUS" -ne 0 ]]; then
            echo "::warning::Spotless encontrou problemas de formatação."
            echo "::warning::Execute './mvnw spotless:apply' para corrigir."
          fi

          exit 0

      - name: SpotBugs
        run: ./mvnw -B compile spotbugs:check

      - name: Prepare test script
        run: chmod +x scripts/test-affected.sh

      - name: Verify affected tests
        run: ./scripts/test-affected.sh

      - name: Verify affected tests
        run: ./scripts/test-affected.sh