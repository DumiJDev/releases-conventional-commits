name: Version

on:
  workflow_run:
    workflows:
      - CI - Main
    types:
      - completed

permissions:
  contents: write

jobs:
  version:
    name: Calculate Version
    if: >
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          token: ${{ secrets.RELEASE_TOKEN }}

      - name: Setup Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Enable Maven Wrapper
        run: chmod +x mvnw

      - name: Validate Maven Wrapper
        run: ./mvnw --version

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Calculate next version
        id: version
        run: |
          set -euo pipefail

          CURRENT_VERSION="$(
            ./mvnw \
              help:evaluate \
              -Dexpression=project.version \
              -q \
              -DforceStdout
          )"

          echo "Current version: $CURRENT_VERSION"

          BASE_VERSION="${CURRENT_VERSION%-SNAPSHOT}"

          LAST_TAG="$(
            git describe \
              --tags \
              --abbrev=0 \
              2>/dev/null || true
          )"

          if [[ -n "$LAST_TAG" ]]; then
            RANGE="${LAST_TAG}..HEAD"
          else
            RANGE="HEAD"
          fi

          echo "Commit range: $RANGE"

          major=false
          minor=false
          patch=false

          while IFS= read -r commit; do

            [[ -z "$commit" ]] && continue

            subject="$(
              git log \
                -1 \
                --format='%s' \
                "$commit"
            )"

            # Ignore release commits.
            if [[ "$subject" =~ ^chore\(release\): ]]; then
              continue
            fi

            echo "Commit: $subject"

            if [[ "$subject" =~ ^(feat|feature)!: ]]; then
              major=true
              continue
            fi

            if [[ "$subject" =~ ^(feat|feature): ]]; then
              minor=true
              continue
            fi

            if [[ "$subject" =~ ^(fix|refactor): ]]; then
              patch=true
              continue
            fi

            if [[ "$subject" =~ ^chore: ]]; then

              files="$(
                git diff-tree \
                  --no-commit-id \
                  --name-only \
                  -r \
                  "$commit"
              )"

              if echo "$files" | grep -Eq \
                '(^main/|^Dockerfile$)'; then
                patch=true
              fi

            fi

          done < <(
            git rev-list "$RANGE"
          )

          if [[ "$major" == "true" ]]; then
            BUMP="major"
          elif [[ "$minor" == "true" ]]; then
            BUMP="minor"
          elif [[ "$patch" == "true" ]]; then
            BUMP="patch"
          else
            BUMP="none"
          fi

          echo "Bump: $BUMP"

          if [[ "$BUMP" == "none" ]]; then
            echo "release=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          IFS='.' read -r major_v minor_v patch_v <<< "$BASE_VERSION"

          case "$BUMP" in
            major)
              major_v=$((major_v + 1))
              minor_v=0
              patch_v=0
              ;;
            minor)
              minor_v=$((minor_v + 1))
              patch_v=0
              ;;
            patch)
              patch_v=$((patch_v + 1))
              ;;
          esac

          NEXT_VERSION="${major_v}.${minor_v}.${patch_v}"

          echo "Next version: $NEXT_VERSION"

          echo "release=true" >> "$GITHUB_OUTPUT"
          echo "version=$NEXT_VERSION" >> "$GITHUB_OUTPUT"

      - name: Update Maven version
        if: steps.version.outputs.release == 'true'
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          ./mvnw \
            versions:set \
            -DnewVersion="$VERSION" \
            -DgenerateBackupPoms=false

      - name: Commit release version
        if: steps.version.outputs.release == 'true'
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail

          git add pom.xml

          git commit \
            -m "chore(release): ${VERSION} [skip ci]"

          git push origin main

      - name: Create release tag
        if: steps.version.outputs.release == 'true'
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail

          git tag "v${VERSION}"

          git push origin "v${VERSION}"
